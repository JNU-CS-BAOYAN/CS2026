name: External link review

on:
  schedule:
    # Monday 10:23 in Asia/Shanghai; avoids the busy start of the hour.
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-link-review
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Review external links
        run: npm run review:links

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-review
          path: reports/links.*
          retention-days: 14
